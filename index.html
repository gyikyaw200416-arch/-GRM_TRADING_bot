<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRM Mining Core</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #05070b; color: #ffffff; overflow: hidden; }
        .app-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a233a 0%, #05070b 100%); z-index: -1; }
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #05070b; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.6s ease;
        }
        .logo-box {
            width: 150px; height: 150px; border-radius: 50%;
            background: linear-gradient(135deg, #f0b90b 0%, #ff5722 100%);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 35px rgba(240, 185, 11, 0.6); margin-bottom: 30px;
        }
        .logo-inner { width: 138px; height: 138px; border-radius: 50%; background-color: #0b0f19; display: flex; justify-content: center; align-items: center; }
        .logo-box span { background: linear-gradient(135deg, #f0b90b, #ff9800); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; font-weight: 900; letter-spacing: 2px; }
        .loading-text { color: #f0b90b; font-size: 16px; font-weight: 600; background: rgba(240, 185, 11, 0.1); padding: 12px 30px; border-radius: 30px; border: 1px solid rgba(240, 185, 11, 0.4); }
        .main-container { display: none; width: 100%; height: calc(100% - 65px); overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 15px; font-weight: bold; position: relative; }
        .user-info { display: flex; align-items: center; gap: 8px; font-size: 13px; background: #121824; padding: 5px 10px; border-radius: 8px; border: 1px solid #212d42; }
        .lvl-badge { background: #212d42; padding: 2px 6px; border-radius: 4px; font-size: 10px; color: #f0b90b; }
        .card { background: #121824; border: 1px solid #212d42; border-radius: 14px; padding: 15px; margin-bottom: 12px; }
        .mine-header { text-align: center; margin-bottom: 15px; }
        .asset-title { color: #8b949e; font-size: 12px; letter-spacing: 1px; margin-bottom: 3px; }
        .asset-amount { font-size: 22px; font-weight: bold; color: #00f0ff; }
        .wallet-info-row { display: flex; justify-content: space-around; text-align: center; font-size: 11px; color: #8b949e; margin-bottom: 8px; }
        .mining-rate { text-align: center; color: #00f0ff; font-size: 20px; font-weight: bold; margin: 10px 0; }
        .coin-box {
            width: 150px; height: 150px; margin: 15px auto;
            background: radial-gradient(circle, #f0b90b 0%, #b78103 100%);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 25px rgba(240, 185, 11, 0.4); border: 4px solid #ffe873;
        }
        .coin-box.mining-anim { animation: pulseCoin 1.5s infinite; }
        @keyframes pulseCoin {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(240, 185, 11, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(240, 185, 11, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 25px rgba(240, 185, 11, 0.4); }
        }
        .coin-inner-text { font-size: 30px; font-weight: 900; color: #111; }
        .claim-btn {
            background: linear-gradient(135deg, #f0b90b 0%, #ff9800 100%);
            color: #000; width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(240, 185, 11, 0.4); margin-top: 10px;
        }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
            background-color: #0b0f19; border-top: 1px solid #212d42;
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { background: none; border: none; color: #8b949e; display: flex; flex-direction: column; align-items: center; cursor: pointer; font-size: 11px; }
        .nav-item.active { color: #f0b90b; }
        .nav-item span.icon { font-size: 18px; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="app-bg"></div>
    <div id="splash-screen">
        <div class="logo-box"><div class="logo-inner"><span>GRM</span></div></div>
        <div class="loading-text">Loading GRM Miner...</div>
    </div>

    <div class="main-container">
        <div id="tab-mine" class="tab-content active">
            <div class="top-bar">
                <div class="user-info">
                    <span class="lvl-badge">Lvl 1</span>
                    <span id="telegram-username">Loading... ⛏️</span>
                    <span style="font-size: 10px; color: #00f0ff;" id="mining-status-badge">IDLE</span>
                </div>
                <div id="ton-connect-button"></div>
            </div>

            <div style="font-size: 10px; color: #2ea043; margin-bottom: 10px;">0.07$ left to Lvl UP</div>
            <div class="mine-header">
                <div class="asset-title">ASSETS</div>
                <div class="asset-amount" id="asset-balance">0.0000 GRM</div>
            </div>
            <div class="wallet-info-row">
                <span id="holding-wallet-text">HOLDING WALLET: 0 GRM</span>
                <span>POOL WALLET: 0.0000 GRM</span>
            </div>
            <div class="mining-rate" id="mining-rate-display">+0.0000</div>
            <div class="coin-box" id="coin-box-elem"><div class="coin-inner-text">GRM</div></div>
            <button class="claim-btn" id="mining-action-btn" onclick="handleMiningAction()">START</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active"><span class="icon">⛏️</span><span>Mine</span></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentUserId = '';
        let currentUserName = 'Miner';

        if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
            currentUserId = String(tg.initDataUnsafe.user.id); // Text အဖြစ်သေချာပြောင်းရန်
            currentUserName = tg.initDataUnsafe.user.first_name || 'Miner';
        } else {
            currentUserId = localStorage.getItem('grm_user_id') || ('user_' + Math.random().toString(36).substring(2, 9));
            localStorage.setItem('grm_user_id', currentUserId);
        }
        document.getElementById('telegram-username').innerText = currentUserName + ' ⛏️';

        const SUPABASE_URL = 'https://uyblmdckdvqgammrfati.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5YmxtZGNrZHZxZ2FtbXJmYXRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTYyNzAsImV4cCI6MjEwNDU5MjI3MH0.vYgmEwENTjeYEqEaE022rDAkAHTWD6pB8E29BoVt0eQ';
        
        let _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/gyikyaw200416-arch/-GRM_TRADING_bot/main/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        let currentBalance = 0.0000;
        let minedAmount = 0.0000;
        let isMining = false;
        let miningInterval;
        let miningStartTime = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            await initUserData();
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) { splash.style.opacity = '0'; setTimeout(() => splash.style.display = 'none', 400); }
                document.querySelector('.main-container').style.display = 'block';
            }, 800);
        });

        function getRealWalletAddress() {
            try {
                if (tonConnectUI && tonConnectUI.wallet && tonConnectUI.wallet.account) {
                    return tonConnectUI.wallet.account.userFriendlyAddress || tonConnectUI.wallet.account.address;
                }
            } catch (e) {
                console.error(e);
            }
            return null;
        }

        async function initUserData() {
            try {
                let walletAddr = getRealWalletAddress();
                
                // Database ထဲမှာ ဒီ user ရှိမရှိ စစ်မည်
                let { data, error } = await _supabase
                    .from('grm_users')
                    .select('*')
                    .eq('user_id', currentUserId)
                    .maybeSingle();

                if (data) {
                    currentBalance = parseFloat(data.balance) || 0;
                    minedAmount = parseFloat(data.mined_amount) || 0;
                    document.getElementById('asset-balance').innerText = currentBalance.toFixed(4) + " GRM";
                    document.getElementById('holding-wallet-text').innerText = "HOLDING WALLET: " + currentBalance.toFixed(4) + " GRM";

                    // အကယ်၍ UI မှာ wallet ချိတ်ထားပြီး DB ထဲမှာ address မရှိသေးရင် အတင်းထည့်မည်
                    if ((!data.wallet_address || data.wallet_address.startsWith('0:')) && walletAddr && !walletAddr.startsWith('0:')) {
                        await _supabase.from('grm_users').update({ wallet_address: walletAddr }).eq('user_id', currentUserId);
                    }
                } else {
                    // User အသစ်ဆိုလျှင် အသစ်ထည့်မည်
                    let initialData = {
                        user_id: currentUserId,
                        username: currentUserName,
                        balance: 0,
                        mined_amount: 0,
                        mining_state: 'idle',
                        mining_start_time: 0
                    };
                    if (walletAddr && !walletAddr.startsWith('0:')) {
                        initialData.wallet_address = walletAddr;
                    }
                    await _supabase.from('grm_users').insert([initialData]);
                }
            } catch (err) {
                console.error("Init Error:", err);
            }
        }

        // Wallet ချိတ်လိုက်သည်နှင့် Table ထဲသို့ တန်းရောက်စေရန်
        tonConnectUI.onStatusChange(async (walletInfo) => {
            let addr = null;
            if (walletInfo && walletInfo.account) {
                addr = walletInfo.account.userFriendlyAddress || walletInfo.account.address;
            }
            if (!addr) {
                addr = getRealWalletAddress();
            }

            if (addr && !addr.startsWith('0:')) {
                console.log("Saving Wallet to Supabase:", addr);
                await _supabase
                    .from('grm_users')
                    .update({ wallet_address: addr, updated_at: new Date().toISOString() })
                    .eq('user_id', currentUserId);
            }
        });

        function handleMiningAction() {
            const btn = document.getElementById('mining-action-btn');
            const statusBadge = document.getElementById('mining-status-badge');
            const coinBox = document.getElementById('coin-box-elem');

            if (!isMining && btn.innerText === "START") {
                isMining = true;
                miningStartTime = Date.now();
                btn.innerText = "MINING IN PROGRESS...";
                btn.style.background = "#212d42";
                btn.style.color = "#00f0ff";
                statusBadge.innerText = "MINING";
                statusBadge.style.color = "#2ea043";
                coinBox.classList.add('mining-anim');

                minedAmount = 0.0000;
                _supabase.from('grm_users').update({ mining_state: 'mining', mining_start_time: miningStartTime }).eq('user_id', currentUserId);

                miningInterval = setInterval(() => {
                    minedAmount += 0.0015;
                    document.getElementById('mining-rate-display').innerText = "+" + minedAmount.toFixed(4);
                    
                    if (minedAmount >= 0.0500) {
                        clearInterval(miningInterval);
                        btn.innerText = "CLAIM GRM";
                        btn.style.background = "#2ea043";
                        btn.style.color = "#fff";
                        statusBadge.innerText = "READY";
                        coinBox.classList.remove('mining-anim');
                        isMining = false;
                        _supabase.from('grm_users').update({ mining_state: 'ready', mined_amount: minedAmount }).eq('user_id', currentUserId);
                    }
                }, 1000);
            } else if (btn.innerText === "CLAIM GRM") {
                currentBalance += minedAmount;
                document.getElementById('asset-balance').innerText = currentBalance.toFixed(4) + " GRM";
                document.getElementById('holding-wallet-text').innerText = "HOLDING WALLET: " + currentBalance.toFixed(4) + " GRM";
                minedAmount = 0.0000;
                document.getElementById('mining-rate-display').innerText = "+0.0000";
                
                btn.innerText = "START";
                btn.style.background = "linear-gradient(135deg, #f0b90b 0%, #ff9800 100%)";
                btn.style.color = "#000";
                statusBadge.innerText = "IDLE";

                _supabase.from('grm_users').update({ balance: currentBalance, mined_amount: 0, mining_state: 'idle', mining_start_time: 0 }).eq('user_id', currentUserId);
            }
        }
    </script>
</body>
</html>
