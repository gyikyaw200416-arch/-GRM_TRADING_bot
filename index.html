<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRM Mining Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #05070b;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        /* Splash Screen with Cyberpunk Style */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f1d 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        .logo-box {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a233a 0%, #0d1117 100%);
            border: 2px solid #f0b90b;
            box-shadow: 0 0 25px rgba(240, 185, 11, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            animation: pulse 2s infinite;
        }
        .logo-box span {
            color: #f0b90b;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(240, 185, 11, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(240, 185, 11, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(240, 185, 11, 0.4); }
        }
        .loading-text {
            color: #f0b90b;
            font-size: 18px;
            font-weight: bold;
            background: rgba(22, 27, 34, 0.8);
            padding: 12px 30px;
            border-radius: 25px;
            letter-spacing: 1px;
            border: 1px solid #f0b90b;
        }
        /* Main App Content */
        #main-app {
            display: none;
            padding: 20px;
            text-align: center;
            color: #ffffff;
        }
        .container {
            max-width: 400px;
            margin: 60px auto;
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        h1 {
            color: #f0b90b;
            font-size: 22px;
        }
        p {
            color: #8b949e;
        }
        .btn {
            background-color: #f0b90b;
            color: #000;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="logo-box">
            <span>GRM</span>
        </div>
        <div class="loading-text">Loading GRM Miner...</div>
    </div>

    <!-- Main Dashboard -->
    <div id="main-app">
        <div class="container">
            <h1>GRM Mining Dashboard</h1>
            <p>Mine GRM tokens directly to your wallet.</p>
            <p>Your Balance: <strong style="color: #2ea043;">0.00 GRM</strong></p>
            <button class="btn" onclick="alert('Mining Started Successfully!')">Start Mining</button>
        </div>
    </div>

    <script>
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            const mainApp = document.getElementById('main-app');
            
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                mainApp.style.display = 'block';
            }, 600);
        }, 2500);
    </script>

</body>
</html>
