<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRM Mining Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #05070b 0%, #111827 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        /* Splash Screen with Fancy Colors */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a2639 0%, #05070b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .logo-box {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f0b90b 0%, #ff5722 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px rgba(240, 185, 11, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.4);
            margin-bottom: 30px;
            animation: bounceGlow 2s infinite alternate;
        }
        .logo-inner {
            width: 138px;
            height: 138px;
            border-radius: 50%;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-box span {
            background: linear-gradient(135deg, #f0b90b, #ff9800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        @keyframes bounceGlow {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(240, 185, 11, 0.5); }
            100% { transform: scale(1.06); box-shadow: 0 0 45px rgba(255, 87, 34, 0.8); }
        }
        .loading-text {
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            background: rgba(240, 185, 11, 0.1);
            padding: 12px 30px;
            border-radius: 30px;
            letter-spacing: 1.5px;
            border: 1px solid rgba(240, 185, 11, 0.4);
            box-shadow: 0 0 15px rgba(240, 185, 11, 0.2);
        }
        /* Main App Content */
        #main-app {
            display: none;
            padding: 20px;
            text-align: center;
            color: #ffffff;
        }
        .container {
            max-width: 400px;
            margin: 60px auto;
            background: linear-gradient(145deg, #161b22, #0d1117);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #f0b90b;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #8b949e;
        }
        .btn {
            background: linear-gradient(135deg, #f0b90b 0%, #ff9800 100%);
            color: #000;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(240, 185, 11, 0.4);
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="logo-box">
            <div class="logo-inner">
                <span>GRM</span>
            </div>
        </div>
        <div class="loading-text">Loading GRM Miner...</div>
    </div>

    <!-- Main Dashboard -->
    <div id="main-app">
        <div class="container">
            <h1>GRM Mining Dashboard</h1>
            <p>Mine GRM tokens directly to your pool wallet.</p>
            <p>Your Balance: <strong style="color: #2ea043; font-size: 18px;">0.00 GRM</strong></p>
            <button class="btn" onclick="alert('Mining Started Successfully! 🚀')">Start Mining</button>
        </div>
    </div>

    <script>
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            const mainApp = document.getElementById('main-app');
            
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                mainApp.style.display = 'block';
            }, 800);
        }, 2500);
    </script>

</body>
</html>
