<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRM Mining Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        .full-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .loading-text {
            position: relative;
            z-index: 2;
            color: #f0b90b;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 24px;
            border-radius: 25px;
            letter-spacing: 1px;
            border: 1px solid #f0b90b;
            margin-top: auto;
            margin-bottom: 60px;
        }
        #main-app {
            display: none;
            padding: 20px;
            text-align: center;
            color: #ffffff;
        }
        .container {
            max-width: 400px;
            margin: 60px auto;
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        h1 {
            color: #f0b90b;
            font-size: 22px;
        }
        p {
            color: #8b949e;
        }
        .btn {
            background-color: #f0b90b;
            color: #000;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <!-- ဤနေရာတွင် ဖိုင်နာမည်တူ grm.jpg ကို ချိတ်ထားပါသည် -->
        <img src="grm.jpg" alt="GRAM Mining Bot" class="full-img" onerror="this.src='https://via.placeholder.com/400x800/000/fff?text=GRM+Miner'">
        <div class="loading-text">Loading GRM Miner...</div>
    </div>

    <!-- Main Dashboard -->
    <div id="main-app">
        <div class="container">
            <h1>GRM Mining Dashboard</h1>
            <p>Mine GRM tokens directly to your wallet.</p>
            <p>Your Balance: <strong style="color: #2ea043;">0.00 GRM</strong></p>
            <button class="btn" onclick="alert('Mining Started Successfully!')">Start Mining</button>
        </div>
    </div>

    <script>
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            const mainApp = document.getElementById('main-app');
            
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                mainApp.style.display = 'block';
            }, 600);
        }, 2500);
    </script>

</body>
</html>
