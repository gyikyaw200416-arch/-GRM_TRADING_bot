<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAM Mining Core</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        h1 {
            color: #f0b90b;
            font-size: 24px;
        }
        p {
            color: #8b949e;
        }
        .btn {
            background-color: #f0b90b;
            color: #000;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GRAM Mining Core</h1>
        <p>Welcome to your Mining Dashboard!</p>
        <p>Your Balance: <strong style="color: #2ea043;">0.00 GRM</strong></p>
        <button class="btn" onclick="alert('Mining Started!')">Start Mining Now</button>
    </div>
</body>
</html>
