<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRM Mining Core</title>
    <!-- Supabase CDN ထည့်သွင်းခြင်း -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #05070b;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f1d 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        .logo-box {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a233a 0%, #0d1117 100%);
            border: 2px solid #f0b90b;
            box-shadow: 0 0 25px rgba(240, 185, 11, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo-box span {
            color: #f0b90b;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .loading-text {
            color: #f0b90b;
            font-size: 18px;
            font-weight: bold;
            background: rgba(22, 27, 34, 0.8);
            padding: 12px 30px;
            border-radius: 25px;
            border: 1px solid #f0b90b;
        }
        #main-app {
            display: none;
            padding: 20px;
            text-align: center;
            color: #ffffff;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        h1 { color: #f0b90b; font-size: 22px; }
        p { color: #8b949e; }
        .btn {
            background-color: #f0b90b;
            color: #000;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
        }
        .wallet-input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="logo-box">
            <span>GRM</span>
        </div>
        <div class="loading-text">Loading GRM Miner...</div>
    </div>

    <!-- Main Dashboard -->
    <div id="main-app">
        <div class="container">
            <h1>GRM Mining Dashboard</h1>
            <p>Mine GRM tokens directly to your wallet.</p>
            <p>Your Balance: <strong style="color: #2ea043;">0.00 GRM</strong></p>
            
            <div style="margin-top: 20px; text-align: left;">
                <label style="font-size: 12px; color: #8b949e;">TON Wallet Address:</label>
                <input type="text" id="walletAddressInput" class="wallet-input" placeholder="UQBV...zssX">
                <button class="btn" onclick="connectAndSaveWallet()">Connect Wallet & Save</button>
            </div>

            <button class="btn" style="background-color: #238636; color: #fff;" onclick="alert('Mining Started!')">Start Mining</button>
        </div>
    </div>

    <script>
        // Supabase Configuration (သင့်ရဲ့ Project အချက်အလက်များ ထည့်ရန်)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Splash screen timer
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            const mainApp = document.getElementById('main-app');
            
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                mainApp.style.display = 'block';
            }, 600);
        }, 2000);

        // Wallet Address ကို Supabase Table သို့ ပို့ပေးမည့် Function
        async function connectAndSaveWallet() {
            const address = document.getElementById('walletAddressInput').value.trim();

            if (!address) {
                alert('ကျေးဇူးပြု၍ Wallet Address ထည့်ပါ။');
                return;
            }

            try {
                // 'wallets' ဆိုတဲ့ Table ထဲသို့ address ထည့်မည် (သင့် Supabase ထဲတွင် wallets table ရှိရပါမည်)
                const { data, error } = await supabaseClient
                    .from('wallets')
                    .insert([{ wallet_address: address, created_at: new Date() }]);

                if (error) {
                    console.error('Supabase Error:', error);
                    alert('Database သို့ ပို့ရာတွင် အမှားအယွင်းရှိTနေသည်: ' + error.message);
                } else {
                    alert('Wallet ချိတ်ဆက်ပြီး Supabase သို့ အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ!');
                }
            } catch (err) {
                console.error('Error:', err);
                alert('ချိတ်ဆက်၍ မရပါ။ အင်တာနက်လိုင်း သို့မဟုတ် Supabase ချိတ်ဆက်မှုကို စစ်ဆေးပါ။');
            }
        }
    </script>

</body>
</html>
