<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monsterland Mining</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #0b0f19; color: #ffffff; overflow: hidden; }
        .app-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #16223b 0%, #0b0f19 100%); z-index: -1; }

        /* Main Container */
        .main-container { width: 100%; height: calc(100% - 65px); overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 15px; font-weight: bold; }
        .user-info { display: flex; align-items: center; gap: 8px; font-size: 13px; background: #121824; padding: 5px 10px; border-radius: 8px; border: 1px solid #212d42; }
        .lvl-badge { background: #d4af37; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

        /* Wallet Button */
        .wallet-container { position: relative; }
        .connect-wallet-btn { background: #0088cc; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; box-shadow: 0 0 10px rgba(0, 136, 204, 0.4); }
        .wallet-address-btn { background: #121824; color: #00f0ff; border: 1px solid #00f0ff; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        /* Wallet Dropdown Menu */
        .wallet-dropdown { display: none; position: absolute; right: 0; top: 38px; background: #161b22; border: 1px solid #30363d; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); width: 150px; z-index: 100; overflow: hidden; }
        .wallet-dropdown.show { display: block; }
        .dropdown-item { padding: 10px 12px; font-size: 12px; color: #fff; cursor: pointer; background: none; width: 100%; text-align: left; border: none; border-bottom: 1px solid #212d42; }
        .dropdown-item:hover { background: #212d42; }
        .dropdown-item.disconnect { color: #ff5722; }

        /* Modals Overlay */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 2000; justify-content: center; align-items: flex-end; }
        .modal-overlay.active { display: flex; }
        
        /* Modal Content */
        .wallet-modal-content { background: #121824; width: 100%; max-width: 450px; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; border-top: 1px solid #30363d; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 16px; font-weight: bold; }
        .modal-close { background: none; border: none; color: #8b949e; font-size: 18px; cursor: pointer; }
        
        /* Spinner & Loading States inside Modal */
        .ton-connect-loading { text-align: center; padding: 20px 0; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(0, 136, 204, 0.2); border-top: 4px solid #0088cc; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .select-app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .select-app-option { background: #1a233a; border: 1px solid #30363d; border-radius: 12px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: #fff; }
        .select-app-option:hover { border-color: #0088cc; }
        .app-icon-circle { width: 36px; height: 36px; background: #0088cc; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; }

        /* Passcode Screen (Video style) */
        #passcode-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0f19; z-index: 3000; flex-direction: column; justify-content: center; align-items: center; }
        .passcode-dots { display: flex; gap: 15px; margin: 25px 0; }
        .dot { width: 14px; height: 14px; border: 2px solid #58a6ff; border-radius: 50%; background: transparent; transition: 0.2s; }
        .dot.filled { background: #58a6ff; }
        .passcode-grid { display: grid; grid-template-columns: repeat(3, 80px); gap: 15px; text-align: center; }
        .num-btn { background: #161b22; border: 1px solid #30363d; color: #fff; font-size: 24px; height: 60px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; margin: 0 auto; width: 60px; }
        .num-btn:active { background: #30363d; }

        /* Tonkeeper Approval Screen (Video style 00:07 - 00:09) */
        .tk-approval-box { text-align: center; padding: 10px 0; }
        .tk-ring { width: 50px; height: 50px; background: #0088cc; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 10px auto; font-size: 22px; }
        .tk-project-logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #f0b90b; }
        .tk-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .tk-desc { font-size: 12px; color: #8b949e; margin-bottom: 15px; line-height: 1.4; }
        
        .account-box { background: #1a233a; border: 1px solid #30363d; border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .acc-left { display: flex; align-items: center; gap: 10px; text-align: left; }
        .acc-key { width: 28px; height: 28px; background: #222; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; }
        
        .notification-toggle { display: flex; justify-content: space-between; align-items: center; background: #1a233a; border: 1px solid #30363d; border-radius: 12px; padding: 10px 12px; margin-bottom: 20px; font-size: 13px; }
        .toggle-switch { width: 40px; height: 22px; background: #238636; border-radius: 11px; position: relative; cursor: pointer; }
        .toggle-switch::after { content: ''; position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: 0.2s; }
        
        .tk-connect-btn { background: #0088cc; color: #fff; width: 100%; padding: 13px; border-radius: 12px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; }

        /* Cards & UI Elements */
        .card { background: #121824; border: 1px solid #212d42; border-radius: 14px; padding: 15px; margin-bottom: 12px; }
        .mine-header { text-align: center; margin-bottom: 15px; }
        .asset-amount { font-size: 24px; font-weight: bold; color: #00f0ff; }
        .claim-btn { background: linear-gradient(135deg, #f0b90b 0%, #ff9800 100%); color: #000; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background-color: #0b0f19; border-top: 1px solid #212d42; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { background: none; border: none; color: #8b949e; display: flex; flex-direction: column; align-items: center; cursor: pointer; font-size: 11px; }
        .nav-item.active { color: #f0b90b; }
        .nav-item span.icon { font-size: 18px; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="app-bg"></div>

    <!-- Passcode Screen (ဗီဒီယို အပိုင်း 00:04) -->
    <div id="passcode-screen">
        <div style="font-size: 16px; font-weight: bold; margin-bottom: 10px;">Enter passcode</div>
        <div class="passcode-dots">
            <div class="dot" id="dot-0"></div>
            <div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
        </div>
        <div class="passcode-grid">
            <button class="num-btn" onclick="pressNum(1)">1</button>
            <button class="num-btn" onclick="pressNum(2)">2</button>
            <button class="num-btn" onclick="pressNum(3)">3</button>
            <button class="num-btn" onclick="pressNum(4)">4</button>
            <button class="num-btn" onclick="pressNum(5)">5</button>
            <button class="num-btn" onclick="pressNum(6)">6</button>
            <button class="num-btn" onclick="pressNum(7)">7</button>
            <button class="num-btn" onclick="pressNum(8)">8</button>
            <button class="num-btn" onclick="pressNum(9)">9</button>
            <div></div>
            <button class="num-btn" onclick="pressNum(0)">0</button>
            <div></div>
        </div>
    </div>

    <!-- Step 1: Connect Modal (ဗီဒီယို အပိုင်း 00:01) -->
    <div id="wallet-modal" class="modal-overlay">
        <div class="wallet-modal-content">
            <div class="modal-header">
                <span>Connect your TON wallet</span>
                <button class="modal-close" onclick="closeModal('wallet-modal')">✕</button>
            </div>
            
            <!-- Loading view inside modal (ဗီဒီယို 00:01 - 00:02) -->
            <div id="modal-loading-view" class="ton-connect-loading">
                <div class="spinner"></div>
                <div style="font-size: 13px; color: #8b949e; margin-bottom: 15px;">Continue in Tonkeeper...</div>
            </div>

            <!-- Select App view (ဗီဒီယို 00:02 - 00:03) -->
            <div id="modal-select-app-view" style="display: none;">
                <div style="font-size: 13px; color: #8b949e; margin-bottom: 10px; text-align: center;">Select app</div>
                <div class="select-app-grid">
                    <div class="select-app-option" onclick="openPasscodeScreen()">
                        <div class="app-icon-circle">💎</div>
                        <span>Tonkeeper</span>
                    </div>
                    <div class="select-app-option" onclick="openPasscodeScreen()">
                        <div class="app-icon-circle" style="background: #238636;">💎</div>
                        <span>Tonkeeper</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Step 2: Tonkeeper Final Approval Screen (ဗီဒီယို 00:07 - 00:09) -->
    <div id="tonkeeper-approval-modal" class="modal-overlay">
        <div class="wallet-modal-content">
            <div class="modal-header">
                <span>Tonkeeper</span>
                <button class="modal-close" onclick="closeModal('tonkeeper-approval-modal')">✕</button>
            </div>
            <div class="tk-approval-box">
                <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px;">
                    <div class="tk-ring">💎</div>
                    <span style="font-size: 20px;">➔</span>
                    <div style="width: 50px; height: 50px; background: #f0b90b; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #000;">M</div>
                </div>
                
                <div class="tk-title">Connect to playmonsterland.com</div>
                <div class="tk-desc">Monsterland is requesting access to your wallet address:</div>
                
                <div class="account-box">
                    <div class="acc-left">
                        <div class="acc-key">🔑</div>
                        <div>
                            <div style="font-size: 13px; font-weight: bold;">Rampage528</div>
                            <div style="font-size: 11px; color: #00f0ff;">UQBV...zssX</div>
                        </div>
                    </div>
                    <span style="color: #238636; font-size: 14px;">✔</span>
                </div>

                <div class="notification-toggle">
                    <span>Allow Notifications</span>
                    <div class="toggle-switch"></div>
                </div>

                <button class="tk-connect-btn" onclick="finalizeConnection()">Connect wallet</button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <div id="tab-mine" class="tab-content active">
            <div class="top-bar">
                <div class="user-info">
                    <span class="lvl-badge">Lv.15</span>
                    <span>Shadow 🛡️</span>
                </div>
                
                <div class="wallet-container">
                    <div id="wallet-unconnected">
                        <button class="connect-wallet-btn" onclick="startTonConnectFlow()">💎 Connect Wallet</button>
                    </div>
                    <div id="wallet-connected" style="display: none;">
                        <button class="wallet-address-btn" onclick="toggleWalletMenu()">
                            <span id="wallet-text">UQBV...zssX</span> ▾
                        </button>
                        <div id="wallet-dropdown" class="wallet-dropdown">
                            <button class="dropdown-item" onclick="copyAddress()">📋 Copy address</button>
                            <button class="dropdown-item disconnect" onclick="disconnectWallet()">🔌 Disconnect</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mine-header">
                <div style="color: #8b949e; font-size: 12px; margin-bottom: 5px;">ALL-TIME EARNINGS</div>
                <div class="asset-amount">2.83M LUMIS</div>
                <button class="claim-btn">INVITE TO EARN LUMIS</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <button class="nav-item active"><span class="icon">⛏️</span><span>Mine</span></button>
    </div>

    <script>
        let enteredPasscode = "";

        function startTonConnectFlow() {
            document.getElementById('wallet-modal').classList.add('active');
            document.getElementById('modal-loading-view').style.display = 'block';
            document.getElementById('modal-select-app-view').style.display = 'none';

            // ဗီဒီယိုထဲကလို Loading ခဏပြပြီး Select App ပေါ်လာအောင် လုပ်ခြင်း
            setTimeout(() => {
                document.getElementById('modal-loading-view').style.display = 'none';
                document.getElementById('modal-select-app-view').style.display = 'block';
            }, 1500);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function openPasscodeScreen() {
            closeModal('wallet-modal');
            enteredPasscode = "";
            updatePasscodeDots();
            document.getElementById('passcode-screen').style.display = 'flex';
        }

        function pressNum(num) {
            if (enteredPasscode.length < 4) {
                enteredPasscode += num;
                updatePasscodeDots();
            }
            if (enteredPasscode.length === 4) {
                setTimeout(() => {
                    document.getElementById('passcode-screen').style.display = 'none';
                    document.getElementById('tonkeeper-approval-modal').classList.add('active');
                }, 300);
            }
        }

        function updatePasscodeDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById('dot-' + i);
                if (i < enteredPasscode.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            }
        }

        function finalizeConnection() {
            closeModal('tonkeeper-approval-modal');
            document.getElementById('wallet-unconnected').style.display = 'none';
            document.getElementById('wallet-connected').style.display = 'block';
        }

        function toggleWalletMenu() {
            document.getElementById('wallet-dropdown').classList.toggle('show');
        }

        function copyAddress() {
            navigator.clipboard.writeText("UQBV...zssX");
            alert('Address copied to clipboard!');
            toggleWalletMenu();
        }

        function disconnectWallet() {
            document.getElementById('wallet-connected').style.display = 'none';
            document.getElementById('wallet-unconnected').style.display = 'block';
            toggleWalletMenu();
        }
    </script>
</body>
</html>
